# nature (macha434/nature-controler) を server_base 配下で動かすための差分。
# アプリ側リポジトリ (macha434/nature-controler) は改変しない。
include:
  - path: ../../../nature-controler/docker-compose.yml
    project_directory: ../../../nature-controler

services:
  nature:
    # アプリ側 compose 自身が `networks: [webnet]` を宣言しているため、
    # 素直に networks を足すと連結マージされて webnet にも残ってしまう。
    # !override で完全に置き換えて net-nature だけにする。
    networks: !override
      net-nature:
        aliases: [nature]
    ports: !reset []
    labels:
      site.host: nature.ubuntu.local
      site.upstream: nature
      site.port: "3001"

  nginx:
    networks: [net-nature]

networks:
  net-nature:
    name: net-nature
