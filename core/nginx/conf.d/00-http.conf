# Docker 埋め込み DNS。ipv6=off がないと解決に失敗しやすい。
# conf.d/*.conf は http {} の中で include されるので、server の外に書けば http コンテキストになる。
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket の Connection ヘッダを正しく振り分ける
# (固定値 "upgrade" だと WebSocket を使わない通常リクエストにも付与されてしまう)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 全vhost共通のアップロードサイズ上限（デフォルト1MBだと大半のアプリで不足するため）。
# アプリ固有の上限に合わせたい場合は該当 server ブロックで上書きする。
client_max_body_size 50m;
