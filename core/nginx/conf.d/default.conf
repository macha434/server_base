# ===================================
# localhost 設定（HTTPのみ）
# ===================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /health {
        access_log off;
        return 200 "OK - localhost";
        add_header Content-Type text/plain;
    }
}

# ===================================
# ubuntu.local 設定（HTTPS強制）
# ===================================

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ubuntu.local;

    include snippets/ssl.conf;
    include snippets/security.conf;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /health {
        access_log off;
        return 200 "OK - ubuntu.local HTTPS";
        add_header Content-Type text/plain;
    }
}

# HTTPからHTTPSへのリダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name ubuntu.local;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
