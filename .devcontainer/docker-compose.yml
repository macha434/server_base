version: '3.8'

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    networks:
      - devnet
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  devnet:
    name: devnet
    driver: bridge